<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AI WeerHub Watch</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef4ff;font-family:Arial,sans-serif}
.wrap{max-width:420px;margin:auto;padding:12px}.card{background:#132238;border-radius:20px;padding:16px;margin-bottom:10px}
.top{text-align:center;background:linear-gradient(145deg,#123b5d,#0891b2)}
.place{font-size:13px;opacity:.8}.temp{font-size:54px;font-weight:800;line-height:1.05;margin:8px 0}.sky{font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#0b1729;border-radius:14px;padding:11px}.label{font-size:11px;color:#9fb3ca}.value{font-size:18px;font-weight:700;margin-top:4px}
button{width:100%;border:0;border-radius:14px;padding:12px;background:#0ea5e9;color:#fff;font-weight:700;font-size:15px}
#status{font-size:11px;color:#9fb3ca;text-align:center;padding:4px}.good{color:#86efac}.warn{color:#fde68a}
</style>
</head>
<body>
<div class="wrap">
<div class="card top">
<div class="place">📍 <span id="place">Emmen</span></div>
<div class="temp"><span id="temp">--</span>°</div>
<div class="sky" id="sky">Weer laden...</div>
<div style="margin-top:10px">🤖 AI <b id="ai">--</b>°C</div>
</div>
<div class="row">
<div class="mini"><div class="label">💧 VOCHT</div><div class="value" id="hum">--%</div></div>
<div class="mini"><div class="label">🌧️ REGEN</div><div class="value" id="rain">--%</div></div>
<div class="mini"><div class="label">💨 WIND</div><div class="value" id="wind">-- km/u</div></div>
<div class="mini"><div class="label">🧭 RICHTING</div><div class="value" id="dir">--</div></div>
</div>
<div class="card">
<div class="label">🧠 AI-ADVIES</div>
<div id="advice" style="font-size:16px;font-weight:700;margin-top:6px">Analyse wordt bijgewerkt...</div>
</div>
<div class="card">
<div class="label">⏱️ KOMENDE UREN</div>
<div id="hours" style="display:flex;gap:7px;overflow:hidden;margin-top:8px"></div>
</div>
<button onclick="load()">🔄 Nu verversen</button>
<div id="status">AI WeerHub Watch • V49 companion</div>
</div>
<script>
const $=id=>document.getElementById(id);
const code=c=>{c=Number(c);if(c===0)return'☀️ Helder';if(c<=3)return'🌤️ Bewolkt';if(c<=48)return'🌫️ Mist';if(c<=67)return'🌧️ Regen';if(c<=77)return'🌨️ Sneeuw';if(c<=82)return'🌦️ Buien';if(c>=95)return'⛈️ Onweer';return'🌦️ Wisselvallig'};
const dir=d=>['N','NO','O','ZO','Z','ZW','W','NW'][Math.round(Number(d)/45)%8]||'--';
async function load(){
 try{
  const lat=52.779,lon=6.906;
  const u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=Europe%2FAmsterdam&forecast_days=2';
  const d=await (await fetch(u,{cache:'no-store'})).json(),c=d.current,h=d.hourly;
  $('place').textContent='Emmen';$('temp').textContent=Math.round(c.temperature_2m);$('sky').textContent=code(c.weather_code);
  $('hum').textContent=Math.round(c.relative_humidity_2m)+'%';$('rain').textContent=Math.round(h.precipitation_probability?.[0]??0)+'%';
  $('wind').textContent=Math.round(c.wind_speed_10m)+' km/u';$('dir').textContent=dir(c.wind_direction_10m);
  $('ai').textContent=Math.round(c.temperature_2m);
  const r=Number(h.precipitation_probability?.[0]??0), w=Number(c.wind_speed_10m??0);
  $('advice').innerHTML=r>=60?'🌧️ Regenkans hoog — paraplu meenemen.':w>=35?'💨 Stevige wind — let op buiten.':c.temperature_2m<8?'🧥 Jas is verstandig.':'👍 Prima weer om naar buiten te gaan.';
  $('hours').innerHTML=h.time.slice(0,6).map((t,i)=>'<div class="mini" style="min-width:58px;text-align:center"><b>'+new Date(t).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+'</b><div>'+code(h.weather_code[i]).split(' ')[0]+'</div><b>'+Math.round(h.temperature_2m[i])+'°</b><div style="font-size:10px">🌧 '+Math.round(h.precipitation_probability?.[i]??0)+'%</div></div>').join('');
  $('status').textContent='Bijgewerkt '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+' • V49';
 }catch(e){$('status').textContent='⚠️ Weer tijdelijk niet beschikbaar';}
}
load();setInterval(load,300000);
</script>
</body>
</html>
