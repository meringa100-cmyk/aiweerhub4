<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b14">
<title>AI WeerHub Watch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:#eef4ff;font-family:Arial,sans-serif}
.wrap{width:100%;max-width:430px;margin:auto;padding:8px}
.card{background:#132238;border-radius:22px;padding:12px;margin-bottom:7px}
.top{text-align:center;background:linear-gradient(145deg,#123b5d,#087f9f);padding:15px 8px}
.place{font-size:12px;opacity:.85;letter-spacing:1px}
.temp{font-size:92px;font-weight:900;line-height:.9;margin:7px 0}
.sky{font-size:22px;font-weight:800}
.ai{margin-top:8px;font-size:14px}.ai b{font-size:25px}
.mainstats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:#0b1729;border-radius:17px;text-align:center;padding:12px 5px}
.stat .label{font-size:11px;color:#9fb3ca}.stat .value{font-size:31px;font-weight:900;margin-top:3px}
.advice{text-align:center;font-size:25px;font-weight:900;line-height:1.1;padding:8px 2px}
.hours{display:flex;gap:5px;overflow:hidden}.hour{min-width:52px;text-align:center;background:#0b1729;border-radius:11px;padding:6px 3px;font-size:9px}.hour b{font-size:14px}
button{width:100%;border:0;border-radius:16px;padding:13px;background:#0ea5e9;color:#fff;font-weight:800;font-size:16px}
#status{font-size:9px;color:#8da3ba;text-align:center;padding:2px}
@media(max-width:250px){.wrap{padding:4px}.temp{font-size:72px}.sky{font-size:18px}.stat .value{font-size:25px}.advice{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card top">
<div class="place">📍 EMMEN</div>
<div class="temp"><span id="temp">--</span>°</div>
<div class="sky" id="sky">Weer laden...</div>
<div class="ai">🤖 AI-model <b id="ai">--</b>°C</div>
</div>
<div class="mainstats">
<div class="stat"><div class="label">🌧️ REGEN</div><div class="value" id="rain">--%</div></div>
<div class="stat"><div class="label">💨 WIND</div><div class="value" id="wind">--</div></div>
</div><div class="value" id="hum">--%</div></div>
<div class="mini"><div class="label">🌧️ REGEN</div><div class="value" id="rain">--%</div></div>
<div class="mini"><div class="label">💨 WIND</div><div class="value" id="wind">--</div></div>

</div>
<div class="card"><div class="label">🧠 AI-ADVIES</div><div class="advice" id="advice">Analyse...</div></div>
<div class="card"><div class="label">⏱️ KOMENDE UREN</div><div class="hours" id="hours"></div></div>
<button onclick="load()">🔄 VERVERS</button>
<div id="status">AI WeerHub Watch • V49 companion</div>
</div>
<script>
const $=id=>document.getElementById(id);
const code=c=>{c=Number(c);if(c===0)return'☀️ Helder';if(c<=3)return'🌤️ Bewolkt';if(c<=48)return'🌫️ Mist';if(c<=67)return'🌧️ Regen';if(c<=77)return'🌨️ Sneeuw';if(c<=82)return'🌦️ Buien';if(c>=95)return'⛈️ Onweer';return'🌦️ Wisselvallig'};
const dir=d=>['N','NO','O','ZO','Z','ZW','W','NW'][Math.round(Number(d)/45)%8]||'--';
async function load(){
 try{
  const u='https://api.open-meteo.com/v1/forecast?latitude=52.779&longitude=6.906&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Europe%2FAmsterdam&forecast_days=2';
  const res=await fetch(u,{cache:'no-store'});if(!res.ok)throw Error();
  const d=await res.json(),c=d.current,h=d.hourly;
  $('temp').textContent=Math.round(c.temperature_2m);
  $('sky').textContent=code(c.weather_code);
  $('hum').textContent=Math.round(c.relative_humidity_2m)+'%';
  $('rain').textContent=Math.round(h.precipitation_probability?.[0]??0)+'%';
  $('wind').textContent=Math.round(c.wind_speed_10m)+' km/u';
  $('dir').textContent=dir(c.wind_direction_10m);
  $('ai').textContent=Math.round(c.temperature_2m);
  const r=Number(h.precipitation_probability?.[0]??0),w=Number(c.wind_speed_10m??0);
  $('advice').textContent=r>=60?'🌧️ Regenkans hoog':w>=35?'💨 Stevige wind':c.temperature_2m<8?'🧥 Jas verstandig':'👍 Prima weer buiten';
  $('hours').innerHTML=h.time.slice(0,6).map((t,i)=>'<div class="hour"><b>'+new Date(t).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+'</b><div>'+code(h.weather_code[i]).split(' ')[0]+'</div><b>'+Math.round(h.temperature_2m[i])+'°</b><div>🌧 '+Math.round(h.precipitation_probability?.[i]??0)+'%</div></div>').join('');
  $('status').textContent='Bijgewerkt '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+' • V49';
 }catch(e){$('status').textContent='⚠️ Weer tijdelijk niet beschikbaar'}
}
load();setInterval(load,300000);
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./watch-sw.js").catch(()=>{});</script>
</body>
</html>
