<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI WeerHub Pro V49</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#123b5d">
<style>
html,body{margin:0;width:100%;height:100%;background:#07111f;color:#eef4ff;font-family:Arial,sans-serif}
#loading{height:100%;display:flex;align-items:center;justify-content:center;font-size:20px}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div id="loading">🌦️ AI WeerHub Pro laden...</div>
<script>
(async()=>{
 try{
   const parts=[];
   for(let i=1;i<=8;i++){
     const r=await fetch('./app/part'+String(i).padStart(2,'0')+'.html?v=72',{cache:'no-store'});
     if(!r.ok) throw new Error('App-deel '+i+' kon niet worden geladen');
     parts.push(await r.text());
   }
   const frame=document.createElement('iframe');
   frame.title='AI WeerHub Pro';
   frame.srcdoc=parts.join('');
   document.body.innerHTML='';
   document.body.appendChild(frame);
 }catch(e){
   document.getElementById('loading').textContent='⚠️ AI WeerHub kon niet laden: '+e.message;
 }
})();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
}
</script>
</body>
</html>
